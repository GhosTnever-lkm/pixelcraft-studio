name: One-time Cargo lockfile refresh

on:
  push:
    branches: [codex/cargo-lock-refresh]

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve workspace manifests and verify locked metadata
        run: |
          cargo metadata --format-version=1 > /dev/null
          cargo metadata --locked --format-version=1 > /dev/null
          git diff --check
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo metadata did not update Cargo.lock; refusing a no-op refresh."
            exit 1
          fi
      - name: Commit the resolved lockfile and remove this temporary workflow
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add Cargo.lock
          git rm .github/workflows/lockfile-refresh.yml
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh Cargo.lock for current workspace manifests'
          git push origin "HEAD:${BRANCH}"
